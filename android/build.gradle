buildscript {
    repositories {
        google()
        mavenCentral()
    }

     dependencies {
        classpath 'com.android.tools.build:gradle:8.0.0'  // Updated Android Gradle Plugin version
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0' // Updated Kotlin plugin
        classpath 'com.google.gms:google-services:4.3.15' // Google Services classpath
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
